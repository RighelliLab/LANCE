name: PR CMD check & BiocCheck

"on":
  pull_request:
    branches:
      - pckg_devel
      - devel
      - "RELEASE_*"
    paths:
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "man/**"
      - "tests/**"
      - "vignettes/**"
      - ".github/workflows/ci.yml"
  push:
    paths:
      - "DESCRIPTION"
      - "NAMESPACE"
      - "R/**"
      - "man/**"
      - "tests/**"
      - "vignettes/**"
      - ".github/workflows/ci.yml"
    branches:
      - pckg_devel
      - devel
      - "RELEASE_*"

jobs:
  ci:
    uses: waldronlab/.github/.github/workflows/bioc-pr-cmdcheck-pkgdown.yml@devel
    permissions:
      contents: read
    with:
      enable_pkgdown: false
      enable_docker: false
    secrets: inherit
